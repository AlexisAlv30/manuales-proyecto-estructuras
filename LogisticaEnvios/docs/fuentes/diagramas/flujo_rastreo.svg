<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1190" viewBox="0 0 840 1190"><defs><marker id="flecha" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="herencia" viewBox="0 0 12 12" refX="11.5" refY="6" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/></marker><marker id="rombo" viewBox="0 0 16 10" refX="0.5" refY="5" markerWidth="15" markerHeight="10" orient="auto-start-reverse"><path d="M0,5 L8,0 L16,5 L8,10 z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="210.0" y="13.0" width="160" height="44" rx="22.0" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/><text x="290.0" y="35.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">Inicio</text><polygon points="141.0,84.0 455.0,84.0 439.0,140.0 125.0,140.0" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="290.0" y="103.5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">El usuario escribe el código</text><text x="290.0" y="120.5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">de rastreo o solo su inicio</text><rect x="110.0" y="170.0" width="360" height="60" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="290.0" y="191.6" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">TRIE · SugerirPorPrefijo(prefijo)</text><text x="290.0" y="208.5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">mue