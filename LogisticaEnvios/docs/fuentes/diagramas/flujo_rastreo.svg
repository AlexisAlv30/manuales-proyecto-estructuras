 font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">UNION-FIND</text><text x="290.0" y="660.4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">Find(origen) y Find(destino)</text><polygon points="290,703.0 410.0,755 290,807.0 170.0,755" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/><text x="290.0" y="746.9" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">¿Tienen el mismo</text><text x="290.0" y="763.1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">representante?</text><rect x="110.0" y="827.0" width="360" height="60" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="290.0" y="848.5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">GRAFO · Dijkstra</text><text x="290.0" y="865.4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">por costo y por tiempo</text><polygon points="290,910.0 400.0,958 290,1006.0 180.0,958" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/><text x="290.0" y="949.9" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">¿Hay un</text><text x="290.0" y="966.1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">camino?</text><rect x="110.0" y="1028.0" width="360" height="58" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/><text x="290.0" y="1048.5" font-family="Segoe UI, Arial, sans-serif" 