e UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">de un solo sentido no</text><text x="625.0" y="974.2" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">permiten llegar</text><polyline points="290.0,57.0 290.0,84.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/><polyline points="290.0,140.0 290.0,170.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/><polyline points="290.0,230.0 290.0,261.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/><polyline points="290.0,309.0 290.0,342.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/><polyline points="290.0,402.0 290.0,422.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/><polyline points="400.0,470.0 500.0,470.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/><rect x="418.4" y="447.0" width="23.2" height="18" rx="3" fill="#ffffff"/><text x="430.0" y="456.0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle" dominant-baseline="middle">no</text><polyline points="290.0,518.0 290.0,537.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/><rect x="300.4" y="518.0" width="23.2" height="18" rx="3" fill="#ffffff"/><text x="312.0" y="527.0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle" dominant-baseline="middle">sí</text><polyline points="290.0,593.0 290.0,622.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/><polyline points="290.0,682.0 290.0,703.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/><polyline points="410.0,755.0 500.0,755.0" fill="none" stroke="#475569" stroke-width="1.6" mark