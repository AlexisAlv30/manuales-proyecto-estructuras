<svg xmlns="http://www.w3.org/2000/svg" width="940" height="830" viewBox="0 0 940 830"><defs><marker id="flecha" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="herencia" viewBox="0 0 12 12" refX="11.5" refY="6" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/></marker><marker id="rombo" viewBox="0 0 16 10" refX="0.5" refY="5" markerWidth="15" markerHeight="10" orient="auto-start-reverse"><path d="M0,5 L8,0 L16,5 L8,10 z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="220.0" y="13.0" width="160" height="44" rx="22.0" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/><text x="300.0" y="35.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">Inicio</text><polygon points="136.0,84.0 480.0,84.0 464.0,136.0 120.0,136.0" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="300.0" y="101.5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">Origen, destino y criterio</text><text x="300.0" y="118.5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">(peso = costo o tiempo)</text><rect x="110.0" y="169.0" width="380" height="62" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/><text x="300.0" y="191.6" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">distancia[i] = ∞ y anterior[i] = −1</text><text x="300.0" y="208.5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">para toda ciudad; distancia[origen] = 0</text><polygon points="300,256.0 465.0,320 300,384.0 135.0,320" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/><text x="300.0" y="303.8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">¿Queda alguna ciudad</text><text x="300.0" y="320.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">no visitada con</text><text x="300.0" y="336.2" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">distancia finita?</text><rect x="110.0" y="425.0" width="380" height="60" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/><text x="300.0" y="446.6" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">Elegir la ciudad u no visitada con</text><text x="300.0" y="463.4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">la menor distancia y marcarla visitada</text><rect x="110.0" y="525.0" width="380" height="80" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/><text x="300.0" y="548.1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">Para cada ruta u → v (lista de adyacencia):</text><text x="300.0" y="565.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">si distancia[u] + peso &lt; distancia[v]</text><text x="300.0" y="581.9" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">actualizar distancia[v] y anterior[v] = u</text><polygon points="640,420.0 755.0,470 640,520.0 525.0,470" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/><text x="640.0" y="462.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">¿distancia[destino]</text><text x="640.0" y="477.8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">= ∞?</text><rect x="510.0" y="562.0" width="260" height="66" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/><text x="640.0" y="578.8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">Reconstruir el camino</text><text x="640.0" y="595.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">recorriendo anterior[]</text><text x="640.0" y="611.2" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">desde el destino</text><rect x="510.0" y="672.0" width="260" height="46" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/><text x="640.0" y="695.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">Devolver el camino y la tabla</text><rect x="765.0" y="569.0" width="140" height="52" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="835.0" y="586.9" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">Devolver</text><text x="835.0" y="603.1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">camino = null</text><rect x="570.0" 